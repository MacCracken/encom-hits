name: Release

on:
  push:
    tags: ['[0-9]*']   # bare SemVer tags (e.g. 0.6.0), matched to VERSION

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        # VERSION is the single source of truth; cyrius.cyml's ${file:VERSION}
        # template derives from it. Assert both equal the pushed tag (matches
        # patra CI), so a tag can never ship a mismatched manifest/binary.
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
              CYML_VERSION="$FILE_VERSION"
          else
              CYML_VERSION="$CYML_RAW"
          fi
          TAG="${GITHUB_REF_NAME}"
          [ "$FILE_VERSION" = "$TAG" ] || { echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          [ "$CYML_VERSION" = "$TAG" ] || { echo "cyrius.cyml ($CYML_RAW) != tag ($TAG)"; exit 1; }

      - name: Install Cyrius toolchain
        run: |
          set -e
          # cyrius.cyml's [package].cyrius pin is the single source of truth.
          # Delegate fetch + layout to the upstream installer (same as the CI
          # gate above and patra / vani / cyrius-doom release flows).
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          cyrius deps
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}
          echo "${{ github.event.repository.name }}: $(wc -c < build/${{ github.event.repository.name }}) bytes"

      - name: Package artifacts
        # Ship the binary, a reproducible source tarball, and a checksum
        # manifest (integrity anchor, matches patra's SHA256SUMS).
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${{ github.event.repository.name }}"
          git archive --format=tar.gz --prefix="${NAME}-${TAG}/" -o "${NAME}-${TAG}-src.tar.gz" HEAD
          sha256sum "build/${NAME}" "${NAME}-${TAG}-src.tar.gz" > SHA256SUMS

      - name: Extract changelog
        # Pull just this version's section from CHANGELOG.md for the release
        # body (curated notes beat auto-generated commit lists).
        run: |
          awk "/^## \\[${GITHUB_REF_NAME}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md
          test -s /tmp/body.md || echo "(no CHANGELOG section for ${GITHUB_REF_NAME})" > /tmp/body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "encom-hits ${{ github.ref_name }}"
          body_path: /tmp/body.md
          # 0.x tags are pre-1.0 — mark them as GitHub pre-releases.
          prerelease: ${{ startsWith(github.ref_name, '0.') }}
          files: |
            build/${{ github.event.repository.name }}
            encom-hits-*-src.tar.gz
            SHA256SUMS
