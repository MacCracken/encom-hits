name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:        # callable as a reusable workflow (release.yml's CI gate)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          set -e
          # cyrius.cyml's [package].cyrius pin is the single source of truth
          # for the toolchain version — nothing is hardcoded in this YAML.
          # Delegate fetch + layout to the upstream installer (matches
          # patra / vani / cyrius-doom CI); it lays out $HOME/.cyrius in the
          # versioned form the cyrius CLI's stdlib resolver expects, so a
          # bare `cyrius deps` resolves the stdlib snapshot correctly.
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        # encom-hits is stdlib-only (no [deps.X] git overrides), so there is
        # no cyrius.lock to verify — `cyrius deps` vendors the stdlib modules
        # listed in [deps].stdlib from the installed toolchain snapshot.
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}
          echo "${{ github.event.repository.name }}: $(wc -c < build/${{ github.event.repository.name }}) bytes"

      - name: Lint
        # Soft gate: runs the linter for visibility but does not fail on style
        # warnings. Eight tank-input one-liners in src/main.cyr exceed the
        # 120-char guide; wrapping them is part of the 0.7→0.9 hardening, after
        # which this can be tightened to a hard "any warn fails".
        run: |
          for f in src/*.cyr; do cyrius lint "$f"; done

      - name: Test
        # `cyrius tests` auto-discovers every .tcyr under tests/ — as of 0.6.3
        # that is the constants suite plus two regression suites (engine-blit,
        # mcpcone-rotation) covering paths the --ppm smoke test cannot reach.
        # Assert on the per-suite lines too, so a suite that runs zero
        # assertions or a newly added file that never gets discovered still
        # fails the job rather than passing silently.
        run: |
          cyrius tests 2>&1 | tee /tmp/test_output
          grep -q ', 0 failed' /tmp/test_output || { echo "::error::test summary missing"; exit 1; }
          if grep -E '[1-9][0-9]* failed' /tmp/test_output; then
            echo "::error::one or more suites reported failures"; exit 1
          fi
          SUITES=$(ls tests/*.tcyr | wc -l)
          tail -1 /tmp/test_output | grep -q "^$SUITES passed, 0 failed" || {
            echo "::error::expected $SUITES suites to run; summary was: $(tail -1 /tmp/test_output)"; exit 1
          }

      - name: Smoke test (headless render)
        # encom-hits is a graphical app — the unit suite can't exercise the
        # framebuffer/render path, so this runs the binary's --ppm screenshot
        # mode (which falls back to PPM when /dev/fb0 is absent, as in CI) and
        # asserts it exits clean and writes a correctly-sized splash frame
        # (P6 320x240 = 230415 bytes). Guards the class of render/sizing bug
        # that a build + unit test alone would miss.
        run: |
          ./build/${{ github.event.repository.name }} --ppm
          test -s /tmp/encom_splash.ppm
          SIZE=$(wc -c < /tmp/encom_splash.ppm)
          test "$SIZE" -eq 230415 || { echo "::error::splash.ppm is $SIZE bytes, expected 230415 (320x240 P6) — framebuffer under-sized?"; exit 1; }
          echo "OK: --ppm rendered $(ls /tmp/encom_*.ppm | wc -l) screens, splash $SIZE bytes"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          for doc in README.md CHANGELOG.md VERSION LICENSE CLAUDE.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md cyrius.cyml; do
            test -f "$doc" && echo "OK: $doc" || { echo "MISSING: $doc"; exit 1; }
          done

      - name: Verify version consistency
        # VERSION is the single source of truth; cyrius.cyml uses the
        # ${file:VERSION} template — resolve it for the comparison. Same
        # shape as patra / cyrius-doom CI.
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
              CYML_VERSION="$FILE_VERSION"
          else
              CYML_VERSION="$CYML_RAW"
          fi
          [ "$FILE_VERSION" = "$CYML_VERSION" ] || { echo "VERSION ($FILE_VERSION) != cyrius.cyml ($CYML_RAW)"; exit 1; }
          grep -q "$FILE_VERSION" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent: $FILE_VERSION (cyml: $CYML_RAW)"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # Cheap, toolchain-free greps over src/ that fail the job on a finding.
    # Per-push net; the SECURITY.md audit checklist is the deep pass.
    steps:
      - uses: actions/checkout@v4

      - name: No shell-injection sinks
        run: |
          if grep -rnE 'sys_system|exec_cmd' src/; then
            echo "::error::shell-injection sink in src/ — never pass untrusted input to a shell"
            exit 1
          fi
          echo "OK: no sys_system / exec_cmd in src/"

      - name: No raw execve
        run: |
          if grep -rnE 'execve|syscall\([[:space:]]*59[[:space:]]*,' src/; then
            echo "::error::raw execve in src/"
            exit 1
          fi
          echo "OK: no raw execve in src/"

      - name: No oversized buffers (>= 64KB)
        # On the pinned toolchain a file-scope `var name[N]` reserves N SLOTS
        # (N*8 bytes) in .bss — not N bytes — so the 64KB bound is N >= 8192,
        # not N >= 65536. Flags any literal-sized array at or above that.
        # (encom's largest are _ai_*[4800] = 38,400 bytes and lc_grid, all
        # file-scope statics in .bss rather than stack frames, well under it.)
        run: |
          BIG=$(grep -rnoE 'var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]' src/ | awk -F'[][]' '$2+0 >= 8192')
          if [ -n "$BIG" ]; then
            echo "::error::array >= 64KB (8192 slots) in src/:"
            echo "$BIG"
            exit 1
          fi
          echo "OK: no arrays >= 64KB in src/"
