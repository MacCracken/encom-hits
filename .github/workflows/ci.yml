name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:        # callable as a reusable workflow (release.yml's CI gate)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          set -e
          # cyrius.cyml's [package].cyrius pin is the single source of truth
          # for the toolchain version — nothing is hardcoded in this YAML.
          # Delegate fetch + layout to the upstream installer (matches
          # patra / vani / cyrius-doom CI); it lays out $HOME/.cyrius in the
          # versioned form the cyrius CLI's stdlib resolver expects, so a
          # bare `cyrius deps` resolves the stdlib snapshot correctly.
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        # encom-hits is stdlib-only (no [deps.X] git overrides). `cyrius deps`
        # vendors the stdlib modules listed in [deps].stdlib from the installed
        # toolchain snapshot. Since 6.6.x it also (re)writes cyrius.lock with a
        # sha256 per vendored file; the lock is tracked for reference (same as
        # cyrius-polyomino) and this step does not `--verify` against it.
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}
          echo "${{ github.event.repository.name }}: $(wc -c < build/${{ github.event.repository.name }}) bytes"

      - name: Lint
        # Hard gate as of 0.7.0. The eight over-long tank-input one-liners this
        # step used to tolerate went away when Battle Tanks movement was
        # rewritten to latch a direction instead of moving inline, so src/ is
        # now lint-clean and the gate can hold that line.
        run: |
          FAIL=0
          for f in src/*.cyr; do
            OUT=$(cyrius lint "$f" 2>&1)
            echo "$OUT"
            if echo "$OUT" | grep -qE '^[[:space:]]*warn '; then
              echo "::error file=$f::lint warnings in $f"; FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] || { echo "::error::lint is a hard gate — fix the warnings above"; exit 1; }

      - name: Format
        # Hard gate as of 0.8.2. It was held back while three files failed
        # `cyrius fmt`; src/ and tests/ have been canonically formatted since the
        # 0.7.1 continuation-indent reflow, so the gate now keeps them that way.
        # `cyrius fmt --check` exits 1 and names the first differing line.
        run: |
          FAIL=0
          for f in src/*.cyr tests/*.tcyr benches/*.bcyr; do
            cyrius fmt --check "$f" || { echo "::error file=$f::not cyrius fmt clean (fix: cyrius fmt $f)"; FAIL=1; }
          done
          [ "$FAIL" -eq 0 ] || { echo "::error::fmt is a hard gate — see the files above"; exit 1; }

      - name: Cross-build (aarch64)
        # Added in 0.8.2. The x86_64 build cannot see a constant that is right
        # on x86_64 and wrong elsewhere: until 0.8.2 src/engine.cyr carried its
        # own x86_64 SYS_* / O_* copies, which override the stdlib's per-target
        # values, so an aarch64 build issued getxattr instead of lseek and passed
        # O_NOFOLLOW as O_LARGEFILE. The aarch64 compiler reports exactly that
        # class ("conflicting value" on a redeclared stdlib constant, "raw
        # syscall" on an x86_64 number it cannot translate). It only catches what
        # the compiler knows to warn about: in 0.8.3 a raw syscall(20, ...)
        # (x86_64 writev) built for aarch64 with no warning and ran as
        # epoll_create1. So a NEW raw syscall number still needs a
        # `qemu-aarch64 -strace` check by hand. Build-only: the binary is not
        # run here or shipped by release.yml.
        run: |
          set -o pipefail
          cyrius build --aarch64 src/main.cyr build/${{ github.event.repository.name }}-aarch64 2>&1 | tee /tmp/a64_build
          if grep -E 'conflicting value|raw syscall' /tmp/a64_build; then
            echo "::error::aarch64 build would issue wrong syscalls or flags — use the lib/syscalls.cyr constants instead of local copies"; exit 1
          fi

      - name: Test
        # `cyrius test tests` auto-discovers every .tcyr under tests/: the
        # constants suite plus regression suites for paths the frame check
        # cannot reach (the fb0 blit, the keyboard parser, the play layer, the
        # tank shots, the font, MCP Cone rotation, Light Cycles head-ons). The
        # old `cyrius tests` spelling was removed in Cyrius 6.7.12. Since 0.8.3
        # there is no [build].test entry, so bare `cyrius test` runs the same
        # suites; the directory is still named so the count below is exact.
        # Assert on the per-suite lines too, so a suite that runs zero
        # assertions or a newly added file that never gets discovered still
        # fails the job rather than passing silently.
        run: |
          cyrius test tests 2>&1 | tee /tmp/test_output
          grep -q ', 0 failed' /tmp/test_output || { echo "::error::test summary missing"; exit 1; }
          if grep -E '[1-9][0-9]* failed' /tmp/test_output; then
            echo "::error::one or more suites reported failures"; exit 1
          fi
          SUITES=$(ls tests/*.tcyr | wc -l)
          tail -1 /tmp/test_output | grep -q "^$SUITES passed, 0 failed" || {
            echo "::error::expected $SUITES suites to run; summary was: $(tail -1 /tmp/test_output)"; exit 1
          }

      - name: Frames (headless render)
        # encom-hits is a graphical app, so the unit suites cannot see what it
        # draws. tests/frames.sh renders all 14 --ppm reference frames twice,
        # once with no scores.dat and once with a fixture scores.dat (so the
        # menu and title cards draw high scores and the load clamp runs), and
        # checks all 28 against tests/frames.sha256. Until 0.8.3 this step only
        # checked the splash file's size, and the committed screenshots were
        # captured without scores, so draw_number was never exercised: 0.6.3
        # found a live rendering bug hiding there.
        run: sh tests/frames.sh build/${{ github.event.repository.name }}

      - name: Bench (informational)
        # Per-game frame cost (render + glow), the two heavy AI steps and the
        # 2560x1440 present path. Not gated: runner timings vary too much to
        # hold a threshold. It does keep benches/ building and running.
        run: cyrius bench benches/frame.bcyr

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          for doc in README.md CHANGELOG.md VERSION LICENSE CLAUDE.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md cyrius.cyml; do
            test -f "$doc" && echo "OK: $doc" || { echo "MISSING: $doc"; exit 1; }
          done

      - name: Verify version consistency
        # VERSION is the single source of truth; cyrius.cyml uses the
        # ${file:VERSION} template — resolve it for the comparison. Same
        # shape as patra / cyrius-doom CI.
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
              CYML_VERSION="$FILE_VERSION"
          else
              CYML_VERSION="$CYML_RAW"
          fi
          [ "$FILE_VERSION" = "$CYML_VERSION" ] || { echo "VERSION ($FILE_VERSION) != cyrius.cyml ($CYML_RAW)"; exit 1; }
          grep -q "$FILE_VERSION" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent: $FILE_VERSION (cyml: $CYML_RAW)"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # Cheap, toolchain-free greps over src/ that fail the job on a finding.
    # Per-push net; the SECURITY.md audit checklist is the deep pass.
    steps:
      - uses: actions/checkout@v4

      - name: No shell-injection sinks
        run: |
          if grep -rnE 'sys_system|exec_cmd' src/; then
            echo "::error::shell-injection sink in src/ — never pass untrusted input to a shell"
            exit 1
          fi
          echo "OK: no sys_system / exec_cmd in src/"

      - name: No raw execve
        run: |
          if grep -rnE 'execve|syscall\([[:space:]]*59[[:space:]]*,' src/; then
            echo "::error::raw execve in src/"
            exit 1
          fi
          echo "OK: no raw execve in src/"

      - name: No oversized buffers (>= 64KB)
        # On the pinned toolchain a file-scope `var name[N]` reserves N SLOTS
        # (N*8 bytes) in .bss — not N bytes — so the 64KB bound is N >= 8192,
        # not N >= 65536. Flags any literal-sized array at or above that.
        # (encom's largest are _ai_*[4800] = 38,400 bytes and lc_grid, all
        # file-scope statics in .bss rather than stack frames, well under it.)
        run: |
          BIG=$(grep -rnoE 'var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]' src/ | awk -F'[][]' '$2+0 >= 8192')
          if [ -n "$BIG" ]; then
            echo "::error::array >= 64KB (8192 slots) in src/:"
            echo "$BIG"
            exit 1
          fi
          echo "OK: no arrays >= 64KB in src/"
